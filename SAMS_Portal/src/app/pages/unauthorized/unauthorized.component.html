
<app-page-header [title]="'Unauthorized'" [breadcrumbs]="[
    { label: 'Unauthorized' }
  ]">
</app-page-header>

<div class="unauthorized-container">
    <div class="content">
        <div class="icon-wrapper">
            <mat-icon class="lock-icon">lock</mat-icon>
        </div>
        <h1>Access Denied</h1>
        <p class="message">
            You don't have permission to access this page.
        </p>
        <p class="sub-message">
            Your current roles:
            <span class="role-tag" *ngFor="let role of userRoles()">{{ role }}</span>
            <span *ngIf="userRoles().length === 0" class="no-role">No roles assigned</span>
        </p>
        <div class="actions">
            <button mat-raised-button color="primary" (click)="goBack()">
                <mat-icon>arrow_back</mat-icon>
                Go Back
            </button>
            <button mat-stroked-button (click)="goToDashboard()">
                <mat-icon>dashboard</mat-icon>
                Dashboard
            </button>
        </div>
    </div>
</div>
